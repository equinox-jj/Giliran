include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - lib/core/l10n/gen/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter: 
  trailing_commas: preserve
  page_width: 120

linter: 
  rules:
  - prefer_relative_imports
  - use_primary_constructors
  - use_declaring_parameters
