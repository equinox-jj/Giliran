name: giliran
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  cached_network_image: ^4.0.6
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  equatable: ^3.0.0
  flutter_local_notifications: ^23.0.0
  logging: ^1.3.0
  connectivity_plus: ^7.3.2
  flutter_native_splash: ^2.4.8
  intl: ^0.20.3
  fpdart: ^1.2.0
  device_info_plus: ^13.3.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  android_intent_plus: ^6.1.0
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  flutter_cache_manager: ^3.4.8
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  crypto: ^3.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  permission_handler: ^13.0.2
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  go_router_builder: ^4.5.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/doodles/
    - assets/images/illustrations/
    - assets/animations/
    - assets/icons/
    - assets/licenses/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
