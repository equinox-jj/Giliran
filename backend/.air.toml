# Live reload for `make dev`: rebuilds ./cmd/api into tmp/ on change.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go", "html", "sql"]
  exclude_dir = ["tmp", "deploy", "docs", "api", "test"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  main_only = true

[misc]
  clean_on_exit = true
