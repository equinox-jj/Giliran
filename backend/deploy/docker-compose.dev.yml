# Local development stack: API, PostgreSQL and MinIO. Ports bind to
# 127.0.0.1 only.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#   docker compose -f deploy/docker-compose.dev.yml watch    # rebuild the API on change
#   docker compose -f deploy/docker-compose.dev.yml run --rm migrate down 1
#
# To run the API on the host with `go run ./cmd/api` instead, start only its
# dependencies: docker compose -f deploy/docker-compose.dev.yml up -d migrate minio-init
#
# Every container reads ../.env (POSTGRES_*, MINIO_ROOT_*). Migrations run on
# every `up` and the MinIO bucket is created if it is missing.
name: giliran-dev

services:
  # Runs the build stage, which has a shell, so DATABASE_URL can be pointed at
  # the postgres service without repeating the password; .env keeps the
  # localhost URL for `go run`.
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: build
    image: giliran-api:dev
    restart: unless-stopped
    env_file: ../.env
    environment:
      MINIO_ENDPOINT: minio:9000
      FIREBASE_CREDENTIALS_FILE: /secrets/firebase-service-account.json
    volumes:
      - ../secrets:/secrets:ro
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable"
        exec /out/api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ../cmd
          action: rebuild
        - path: ../internal
          action: rebuild
        - path: ../pkg
          action: rebuild
        - path: ../go.mod
          action: rebuild
        - path: ../go.sum
          action: rebuild

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Arguments after the service name are passed to migrate (default: up).
  # Writable so `run --rm migrate create -ext sql -dir /migrations -seq <name>`
  # can add files.
  migrate:
    image: migrate/migrate:v4.20.1
    env_file: ../.env
    volumes:
      - ../db/migrations:/migrations
    entrypoint:
      - sh
      - -c
      - exec migrate -path /migrations -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable" "$$@"
      - migrate
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # The official MinIO images are no longer published; pgsty/minio is the
  # maintained community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    env_file: ../.env
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Creates the private bucket (MINIO_BUCKET, default giliran), then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    env_file: ../.env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET:-giliran}"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
