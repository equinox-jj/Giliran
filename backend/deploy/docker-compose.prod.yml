# Production stack: API, PostgreSQL and MinIO on one host (Dokploy).
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Every container reads ../.env. Inside this network the services are reached
# by name, so the production .env must use:
#   DATABASE_URL=postgres://<user>:<password>@postgres:5432/<db>?sslmode=disable
#   MINIO_ENDPOINT=minio:9000
#
# Only the API is published, on 127.0.0.1:8080 for the Cloudflare Tunnel.
# PostgreSQL and MinIO are reachable from this network only.
name: giliran

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: giliran-api:local
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.20.1
    env_file: ../.env
    volumes:
      - ../db/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - exec migrate -path /migrations -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable" "$$@"
      - migrate
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # The official MinIO images are no longer published; pgsty/minio is the
  # maintained community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    env_file: ../.env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    env_file: ../.env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET:-giliran}"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
