# Production stack: API, worker, PostgreSQL and MinIO on one host (Dokploy).
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Every container reads ../.env. Inside this network the services are reached
# by name, so the production .env must use:
#   DATABASE_URL=postgres://<user>:<password>@postgres:5432/<db>?sslmode=disable
#   MINIO_ENDPOINT=minio:9000
#   MINIO_PUBLIC_URL=https://<files hostname>
#   OTP_SECRET=<openssl rand -hex 32>   (API and worker)
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_TLS, SMTP_FROM
#                                       (worker; it sends the sign-in codes)
# The app downloads avatars and proofs from presigned URLs signed for
# MINIO_PUBLIC_URL, so route that hostname (e.g. a second Cloudflare Tunnel
# ingress) to minio:9000 without rewriting the Host header.
#
# Only the API is published, on 127.0.0.1:8080 for the Cloudflare Tunnel.
# PostgreSQL, MinIO and the worker are reachable from this network only.
#
# Two optional services sit behind profiles, so `up` leaves them out:
#   backup      daily off-site pg_dump + MinIO mirror; schedule it on the host
#               (cron or a Dokploy schedule), e.g. at 02:00 WIB:
#               docker compose -f deploy/docker-compose.prod.yml run --rm backup
#   monitoring  Uptime Kuma on 127.0.0.1:3001 (reach it over Tailscale):
#               docker compose -f deploy/docker-compose.prod.yml --profile monitoring up -d
name: giliran

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: giliran-api:local
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      river-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Runs River's jobs: emails, pushes, reminders, alerts, expiry and cleanup.
  # Only the worker needs the Firebase key (FCM) and SMTP.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: giliran-worker:local
    restart: unless-stopped
    env_file: ../.env
    environment:
      FIREBASE_CREDENTIALS_FILE: /secrets/firebase-service-account.json
    volumes:
      # the image runs as uid 65532 (distroless nonroot); the key must be readable by it
      - ../secrets:/secrets:ro
    depends_on:
      river-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Creates or upgrades River's job tables, then exits. The API enqueues
  # jobs, so it waits for this too.
  river-migrate:
    image: giliran-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: ../.env
    command: ["migrate"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.20.1
    env_file: ../.env
    volumes:
      - ../db/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - exec migrate -path /migrations -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable" "$$@"
      - migrate
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # The official MinIO images are no longer published; pgsty/minio is the
  # maintained community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    env_file: ../.env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    env_file: ../.env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET:-giliran}"
    depends_on:
      minio:
        condition: service_healthy

  # Off-site backup (deploy/backup/backup.sh). Needs BACKUP_S3_* in ../.env.
  backup:
    profiles: [backup]
    build:
      context: backup
    image: giliran-backup:local
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Monitors http://api:8080/api/v1/health (503 when the database is down)
  # and the public URL through the tunnel; alerts are set up in its UI.
  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:2.5.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  postgres-data:
  minio-data:
  uptime-kuma-data:
