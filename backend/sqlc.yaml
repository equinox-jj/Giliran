# sqlc generates internal/repository/sqlc from db/queries, reading the schema
# from the golang-migrate files (down migrations are ignored). Run `make gen`.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # DATE columns are business dates in Asia/Jakarta (pgx scans them at UTC midnight).
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
        rename:
          requester_ip: RequesterIP
          provider_message_id: ProviderMessageID
          pin_hash: PINHash
          pin_failed_count: PINFailedCount
          pin_locked_until: PINLockedUntil
          qris_payload: QRISPayload
          qris_image_key: QRISImageKey
