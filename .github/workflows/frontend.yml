# Frontend CI: format, analyze and test the Flutter app on every push and pull
# request that touches frontend/, and build a signed release App Bundle on
# pushes to main.
#
# Secrets (repository settings → Secrets and variables → Actions):
#   FIREBASE_OPTIONS_DART_B64  base64 of lib/firebase_options.dart
#   GOOGLE_SERVICES_JSON_B64   base64 of android/app/google-services.json
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The Firebase files and the keystore are gitignored, so CI recreates them.
name: frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore Firebase options
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          # lib/firebase_options.dart is tracked in git; only override it when the
          # secret is set, otherwise an empty secret would wipe the file.
          if [ -n "$FIREBASE_OPTIONS_DART_B64" ]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart
            # The secret holds raw FlutterFire output, which isn't formatted to our page width.
            dart format lib/firebase_options.dart
          fi
          grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart \
            || { echo "::error::lib/firebase_options.dart lacks DefaultFirebaseOptions (check FIREBASE_OPTIONS_DART_B64)"; exit 1; }
      # pub get also generates the l10n output.
      - run: flutter pub get
      # Before build_runner: generated *.g.dart files aren't formatted.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Known vulnerabilities in dependencies
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pubspec.lock

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables), e.g. https://giliran.monai.my.id/api/v1
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::Set the API_BASE_URL repository variable to an https:// URL"; exit 1 ;;
          esac
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: giliran-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
